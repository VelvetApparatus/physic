services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    hostname: minio
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
    command: server --console-address ":9001" /data

  db:
    image: postgres:14-alpine
    restart: always
    hostname: pg
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - physk_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=local
      - POSTGRES_USER=rootuser
      - POSTGRES_DB=local_db

volumes:
  physk_db:
  minio_storage:


networks:
  default:
    external:
      name: physk